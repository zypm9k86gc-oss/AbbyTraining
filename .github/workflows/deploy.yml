name: Publish AbbyTraining
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
      - name: JavaScript-Syntax prüfen
        run: node --check app.js
      - name: Python vorbereiten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: iPhone-App-Icons aus Abbys Zeichnung erstellen
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url='assets/abby-kopf.svg',
                              write_to=f'assets/icon-{size}.png',
                              output_width=size, output_height=size)
          PY
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: App-Dateien bereitstellen
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

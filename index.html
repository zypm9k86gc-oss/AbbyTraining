<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#839f90" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AbbyTraining" />
  <meta name="description" content="Sanftes Hinterhandtraining für deinen Seniorhund – Übungen, Kalender und Fortschritt." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
  <title>AbbyTraining · Hinterhand</title>
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <button class="brand" id="homeButton" type="button" aria-label="Zum Trainingskalender">
        <img class="brand-avatar" src="./assets/abby-portrait.webp" alt="Schwarzer Labrador-Mischling mit weißer Brust" />
        <span class="brand-copy"><strong>AbbyTraining</strong><small>Sanftes Training mit Abby</small></span>
      </button>
      <span class="top-pill" id="topPill" aria-live="polite">Abbys 6-Wochen-Plan</span>
    </header>
    <main id="main" class="main-content" tabindex="-1" aria-live="polite"></main>
    <section id="cloudPanel" class="cloud-panel" aria-label="Cloud-Synchronisierung"></section>
    <nav class="bottom-nav" aria-label="Seitennavigation">
      <button type="button" id="prevButton" class="nav-arrow" aria-label="Vorherige Seite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button type="button" id="navHome" class="nav-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M7 2v4M17 2v4M3 9h18"/><path d="m9 15 2 2 4-4"/></svg><span>Kalender</span></button>
      <div class="pager"><div id="pageDots" class="page-dots" aria-hidden="true"></div><span id="pageLabel">Kalender</span></div>
      <button type="button" id="nextButton" class="nav-arrow primary" aria-label="Nächste Seite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </nav>
  </div>
  <input type="file" id="importInput" accept="application/json,.json" hidden />
  <script src="./supabase-config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./app.js" defer></script>
  <script src="./cloud.js" defer></script>
</body>
</html>
